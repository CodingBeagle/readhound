<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="description" content="Track what you read, organise your books and explore your reading stats." />
    <title>Readhound</title>
    <script>
      // Apply the saved theme before the first paint (see src/ui/theme/themes.ts).
      try {
        var theme = localStorage.getItem('readhound.theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <style>
      /* Splash while the app loads; React replaces #root's content when it starts. */
      #splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; font: 600 20px/1 system-ui, sans-serif; color: #57534e; background: #fafaf9; }
      @media (prefers-color-scheme: dark) { #splash { color: #d6d3d1; background: #0c0a09; } }
      #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 32px -12px #db2777; animation: splash-in 0.7s cubic-bezier(0.34, 1.45, 0.64, 1) both, splash-bob 1.4s ease-in-out 0.7s infinite; }
      @keyframes splash-in { from { opacity: 0; scale: 0.6; } }
      @keyframes splash-bob { 50% { translate: 0 -6px; } }
      :root[data-theme='midnight'] #splash { color: #cbd5e1; background: #0a0d1c; }
      :root[data-theme='aurora'] #splash { background: #f6f4ff; }
      :root[data-theme='bookshop'] #splash { background: #f5efe3; }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash" aria-label="Readhound is loading" role="status"><img src="/logo.svg" alt="" />Readhound</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
